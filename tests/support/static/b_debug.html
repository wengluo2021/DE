<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DERag · B 检索验证</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#20352e;background:#f3f6f3;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:#163d33;color:#fff;padding:28px max(24px,calc((100% - 1280px)/2));display:flex;align-items:center;justify-content:space-between}h1{font-size:24px;margin:0 0 6px}header p{color:#b9d6c8;margin:0}header a{color:#ddeddc}main{max-width:1328px;margin:auto;padding:24px}.panel{background:white;border:1px solid #dbe5dc;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 3px 12px #193c2805}h2{font-size:18px;margin:0 0 18px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.badge{background:#e5f3e9;color:#235239;padding:6px 12px;border-radius:30px;font-weight:600}.warning{background:#fff2d3;color:#754e0a;border-radius:8px;padding:12px 16px;margin:12px 0}.muted,small{color:#6c7c72}.error{color:#9a2e2e;background:#fff1ef;border-radius:8px;padding:12px;white-space:pre-wrap}.good{color:#246348}button{background:#286446;border:0;color:white;padding:10px 16px;border-radius:7px;cursor:pointer;font:inherit}button.secondary{background:#edf3ee;color:#28533a}button:disabled{opacity:.4;cursor:not-allowed}select,input{font:inherit;border:1px solid #cdd9cf;border-radius:7px;padding:9px;background:white;max-width:100%}input{flex:1;min-width:180px}pre{font:13px/1.8 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f9f6;border-radius:8px;padding:14px;max-height:380px;overflow:auto;margin:10px 0}.results{display:grid;gap:12px}.card{border:1px solid #dce6dd;border-radius:9px;padding:15px}.card p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;margin:10px 0;max-height:230px;overflow:auto}.meta{font:12px/1.7 ui-monospace,Consolas,monospace;color:#6a7c70;overflow-wrap:anywhere}.metrics{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.metric{background:#f1f6ef;padding:10px 14px;border-radius:8px;flex:1;min-width:130px}.metric b{display:block;font-size:17px;margin-bottom:5px}dialog{width:min(850px,94vw);border:1px solid #cad8ce;border-radius:14px;padding:24px}dialog::backdrop{background:#102b2390}#notice{margin-bottom:18px}.empty{padding:20px;color:#778278;text-align:center;border:1px dashed #d9e1d9;border-radius:8px}label{font-size:13px;color:#556a5b}.grow{flex:1}footer{text-align:center;color:#7b887d;padding:12px 0 30px;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}header{padding:24px}main{padding:16px}.panel{padding:16px}}
.grid>*{min-width:0}.row{min-width:0;max-width:100%}#document{min-width:0}#notice,#taskState{overflow-wrap:anywhere;white-space:pre-wrap}
</style></head><body>
<header><div><h1>DERag / B 检索验证</h1><p>两种切分 · 四组索引 · 原文证据</p></div><a href="/docs" target="_blank" rel="noopener">API 文档 ↗</a></header>
<main>
<section class="panel"><div class="row between"><h2>运行状态</h2><div class="row"><span id="mode" class="badge">读取中</span><button id="refresh" class="secondary">刷新状态</button></div></div>
<div id="modeNote" class="warning"></div><div id="statusText" class="meta"></div><div id="metrics" class="metrics"></div>
<div class="row" style="margin-top:16px"><button id="build">建立四组测试索引</button><span id="taskState" class="muted">建库完成后可预览分块、搜索和对照。</span></div></section>
<div id="notice" role="status" aria-live="polite"></div>
<section class="panel"><div class="row between"><h2>01 / 文档与分块</h2><div class="row"><label for="document">合成文档</label><select id="document"></select><label for="condition">条件</label><select id="condition"></select></div></div>
<div class="grid"><div><h3>冻结原文</h3><div id="documentMeta" class="meta"></div><pre id="sourceText">正在读取文档…</pre></div><div><h3 id="chunkTitle">服务器返回的分块</h3><div id="chunks" class="results"></div></div></div></section>
<section class="panel"><h2>02 / 单组检索</h2><div class="row"><input list="exampleQuestions" id="question" aria-label="检索问题" value="How can an individual request deletion of personal information?"><datalist id="exampleQuestions"><option value="How can an individual request deletion of personal information?"></option><option value="Can a reader renew a library book when the loan period expires?"></option><option value="What should a bus driver do after noticing an abnormal road condition?"></option></datalist><select id="searchCondition" aria-label="检索条件"></select><button id="search" disabled>检索 top-5</button></div><p id="searchMeta" class="meta"></p><div id="hits" class="results"></div></section>
<section class="panel"><div class="row between"><h2>03 / 同题对照</h2><div class="row"><label for="left">左侧</label><select id="left"></select><label for="right">右侧</label><select id="right"></select><button id="compare" disabled>使用上方问题对照</button></div></div>
<p class="muted">两侧使用同一问题、语料版本和索引版本；展示原文块及返回字符总数。</p><div class="grid"><div><h3 id="leftTitle">左侧</h3><div id="leftHits" class="results"></div></div><div><h3 id="rightTitle">右侧</h3><div id="rightHits" class="results"></div></div></div></section>
<footer>B 独立验证入口 · 合成文档不是官方法规 · 不生成法律答案，不计入正式评估</footer>
</main>
<dialog id="sourceDialog"><div class="row between"><h2>原文核对</h2><button id="closeDialog" class="secondary">关闭</button></div><pre id="hitMeta"></pre><h3>服务器返回的原文片段</h3><pre id="hitText"></pre><h3>完整冻结正文</h3><pre id="dialogDocument"></pre></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const labels={f400:'F400 · 固定窗口 400 字',s400:'S400 · 结构感知 400 字',f800:'F800 · 固定窗口 800 字',s800:'S800 · 结构感知 800 字'};
let corpus='',ready=false,busy=false,docSeq=0,querySeq=0;
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function notice(text,error=false){$('notice').className=error?'error':'muted';$('notice').textContent=text;}
async function api(path,body){const response=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(`${data.code||response.status}: ${data.message||'请求失败'}`);return data;}
function clearQueries(){querySeq++;for(const id of ['hits','leftHits','rightHits','searchMeta'])$(id).replaceChildren();$('leftTitle').textContent='左侧';$('rightTitle').textContent='右侧';}
function controls(){for(const id of ['search','compare'])$(id).disabled=!ready||busy;$('build').disabled=busy;$('refresh').disabled=busy;}
function empty(target,text){$(target).replaceChildren(el('div',text,'empty'));}
async function refresh(){const data=await api('/b-debug/status');corpus=data.corpus_version;ready=data.ready;$('mode').textContent=data.mode.toUpperCase();$('modeNote').textContent=data.mode==='mock'?'模拟 embedding，仅供接口与流程验证；排序不代表语义检索质量。':'真实 embedding + 合成测试语料；使用本地固定版本模型，不调用 LLM。';$('statusText').textContent=`语料: ${corpus} | 模型: ${data.model.model_id}\nrevision: ${data.model.revision}\n索引: ${data.index_version||'尚未就绪'}${data.error?'\n'+data.error.code+': '+data.error.message:''}`;$('statusText').style.whiteSpace='pre-wrap';$('metrics').replaceChildren();for(const [key,value]of Object.entries(data.conditions)){const item=el('div',undefined,'metric');item.append(el('b',key.toUpperCase()),el('span',value&&value.count!==undefined?`${value.count} 块 · 最长 ${value.max_chars} 字`:'未就绪'));$('metrics').append(item);}controls();return data;}
async function loadDocument(){const seq=++docSeq;clearQueries();$('chunks').replaceChildren();$('sourceText').textContent='读取中…';const id=$('document').value;if(!id)return;const doc=await api(`/api/documents/${encodeURIComponent(id)}?corpus_version=${encodeURIComponent(corpus)}`);if(seq!==docSeq)return;$('sourceText').textContent=doc.text;$('documentMeta').textContent=`${doc.document_id} · ${doc.source_url}`;if(!ready){empty('chunks','先建立四组索引，再查看分块。');return;}const condition=$('condition').value;const result=await api(`/api/documents/${encodeURIComponent(id)}/chunks?condition=${condition}&corpus_version=${encodeURIComponent(corpus)}`);if(seq!==docSeq)return;$('chunkTitle').textContent=`${labels[condition]} / ${result.items.length} 块`;render('chunks',result.items);}
function render(target,hits){$(target).replaceChildren();if(!hits.length){empty(target,'没有返回块。');return;}for(const hit of hits){const card=el('div',undefined,'card');card.append(el('b',hit.rank?`#${hit.rank} · ${hit.title} · score ${hit.score.toFixed(4)}`:`${hit.condition.toUpperCase()} · 块 ${hit.start}–${hit.end}`),el('div',`[${hit.start}, ${hit.end}) · ${hit.end-hit.start} 字 · ${(hit.article_labels||hit.article_ids).join('、')||'标题/空白'}`,'meta'),el('div',hit.chunk_id,'meta'),el('p',hit.text));if(hit.source_url)card.append(el('div',hit.source_url,'meta'));const button=el('button','查看来源片段','secondary');button.onclick=()=>showSource(hit).catch(e=>notice(e.message,true));card.append(button);$(target).append(card);}}
async function showSource(hit){$('hitMeta').textContent=JSON.stringify({document_id:hit.document_id,article_ids:hit.article_ids,start:hit.start,end:hit.end,chunk_id:hit.chunk_id,source_url:hit.source_url},null,2);$('hitText').textContent=hit.text;$('dialogDocument').textContent='读取中…';$('sourceDialog').showModal();try{const doc=await api(`/api/documents/${encodeURIComponent(hit.document_id)}?corpus_version=${encodeURIComponent(corpus)}`);$('dialogDocument').textContent=doc.text;}catch(e){$('dialogDocument').textContent=e.message;}}
async function runQuery(compare){clearQueries();const seq=querySeq;const question=$('question').value;if(!question.trim()){notice('请输入问题。',true);return;}busy=true;controls();notice('检索中…');try{if(compare){const data=await api('/api/compare',{question,corpus_version:corpus,left_condition:$('left').value,right_condition:$('right').value});if(seq!==querySeq)return;for(const side of ['left','right']){$(side+'Title').textContent=`${labels[data[side].condition]} · ${data[side].context_chars} 字 · ${data[side].timing_ms} ms`;render(side+'Hits',data[side].hits);}notice(`对照完成 · index ${data.index_version}`);}else{const data=await api('/api/search',{question,corpus_version:corpus,condition:$('searchCondition').value,top_k:5});if(seq!==querySeq)return;$('searchMeta').textContent=`${data.hits.length} 个结果 · ${data.timing_ms} ms · index ${data.index_version}`;render('hits',data.hits);notice('检索完成。');}}catch(e){notice(e.message,true);}finally{busy=false;controls();}}
async function build(){clearQueries();ready=false;busy=true;controls();notice('正在提交四组建库任务…');try{const task=await api('/api/indexes/build',{corpus_version:corpus});for(;;){const progress=await api('/api/tasks/'+task.task_id);$('taskState').textContent=`${progress.state} · ${task.task_id}`;if(progress.state==='completed'){notice(`四组建库完成 · ${progress.result.build_ms} ms`);break;}if(progress.state==='failed')throw Error(`${progress.error.code}: ${progress.error.message}`);await new Promise(resolve=>setTimeout(resolve,700));}await refresh();await loadDocument();}catch(e){notice(e.message,true);await refresh().catch(()=>{});}finally{busy=false;controls();}}
for(const id of ['condition','searchCondition','left','right']){for(const [value,label]of Object.entries(labels)){const option=el('option',label);option.value=value;$(id).append(option);}}$('condition').value='s400';$('searchCondition').value='s400';$('right').value='s400';
$('document').onchange=()=>loadDocument().catch(e=>notice(e.message,true));$('condition').onchange=$('document').onchange;
for(const id of ['question','searchCondition','left','right'])$(id).addEventListener('input',clearQueries);
$('search').onclick=()=>runQuery(false);$('compare').onclick=()=>runQuery(true);$('build').onclick=build;$('closeDialog').onclick=()=>$('sourceDialog').close();$('refresh').onclick=async()=>{try{clearQueries();await refresh();await loadDocument();}catch(e){notice(e.message,true);}};
(async()=>{try{await refresh();const data=await api('/api/documents?corpus_version='+encodeURIComponent(corpus));for(const doc of data.items){const option=el('option',doc.title);option.value=doc.document_id;$('document').append(option);}$('document').value='privacy';await loadDocument();}catch(e){notice(e.message,true);}})();
</script></body></html>
